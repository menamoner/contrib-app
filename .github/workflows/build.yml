name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create project files
        run: |
          mkdir -p "$(dirname 'project/settings.gradle')"
          cat > 'project/settings.gradle' <<'__EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ContribApp"
          include ':app'
          __EOF__
          mkdir -p "$(dirname 'project/build.gradle')"
          cat > 'project/build.gradle' <<'__EOF__'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          __EOF__
          mkdir -p "$(dirname 'project/gradle.properties')"
          cat > 'project/gradle.properties' <<'__EOF__'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          __EOF__
          mkdir -p "$(dirname 'project/app/build.gradle')"
          cat > 'project/app/build.gradle' <<'__EOF__'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.contrib.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.contrib.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          __EOF__
          mkdir -p "$(dirname 'project/app/src/main/AndroidManifest.xml')"
          cat > 'project/app/src/main/AndroidManifest.xml' <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __EOF__
          mkdir -p "$(dirname 'project/app/src/main/res/values/strings.xml')"
          cat > 'project/app/src/main/res/values/strings.xml' <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">حساب المساهمات</string>
          </resources>
          __EOF__
          mkdir -p "$(dirname 'project/app/src/main/res/drawable/ic_launcher.xml')"
          cat > 'project/app/src/main/res/drawable/ic_launcher.xml' <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00A651" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M30,34h48v8h-48z" />
              <path android:fillColor="#FFFFFF" android:pathData="M30,50h48v8h-48z" />
              <path android:fillColor="#FFFFFF" android:pathData="M30,66h30v8h-30z" />
          </vector>
          __EOF__
          mkdir -p "$(dirname 'project/app/src/main/java/com/contrib/app/MainActivity.java')"
          cat > 'project/app/src/main/java/com/contrib/app/MainActivity.java' <<'__EOF__'
          package com.contrib.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.webkit.JsResult;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);

                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(message)
                              .setPositiveButton("موافق", (d, w) -> result.confirm())
                              .setNegativeButton("إلغاء", (d, w) -> result.cancel())
                              .setOnCancelListener(d -> result.cancel())
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(message)
                              .setPositiveButton("موافق", (d, w) -> result.confirm())
                              .setOnCancelListener(d -> result.confirm())
                              .show();
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }
          }
          __EOF__
          mkdir -p "$(dirname 'project/app/src/main/assets/index.html')"
          cat > 'project/app/src/main/assets/index.html' <<'__EOF__'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
          <title>حساب المساهمات</title>
          <style>
          *{box-sizing:border-box;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
          body{margin:0;padding:10px;background:#f4f4f4;color:#000}
          h1{font-size:18px;text-align:center;margin:6px 0 10px}
          .top{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
          .box{border:2px solid #000;border-radius:6px;padding:6px;text-align:center;font-weight:bold}
          .box label{display:block;font-size:12px;margin-bottom:3px}
          .box input{width:100%;text-align:center;font-size:16px;font-weight:bold;border:1px solid #666;border-radius:4px;padding:4px;background:#fff}
          .box .v{font-size:17px}
          .c-amount{background:#00ffff}.c-profit{background:#b6d7a8}.c-exp{background:#ff9900}.c-net{background:#00ff00}
          .add{display:flex;gap:6px;margin-bottom:8px}
          .add input{flex:1;font-size:16px;padding:8px;border:2px solid #000;border-radius:6px;text-align:center}
          .add button{font-size:16px;font-weight:bold;padding:8px 14px;border:2px solid #000;border-radius:6px;background:#00ff00}
          .wrap{overflow-x:auto}
          table{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
          th,td{border:2px solid #000;padding:5px 3px;font-weight:bold}
          th.h-id,th.h-pct,th.h-net{background:#00ff00}
          th.h-amt{background:#00ffff}th.h-gain{background:#b6d7a8}th.h-exp{background:#ff9900}
          th.h-del{background:#eee}
          td.id{background:#fff;font-size:16px}
          td.amt{background:#00ffff}td.pct{background:#ffff00}td.gain{background:#b6d7a8}
          td.exp{background:#ff9900}td.net{background:#00ff00}
          td.amt input{width:78px;text-align:center;font-weight:bold;font-size:13px;border:1px solid #666;border-radius:4px;background:#fff;padding:3px}
          td.del{background:#fff}
          td.del button{border:none;background:#d32f2f;color:#fff;border-radius:4px;padding:4px 8px;font-size:13px}
          tfoot td{background:#ddd}
          .empty{padding:20px;text-align:center;color:#666}
          </style>
          </head>
          <body>
          <h1>حساب المساهمات والأرباح</h1>

          <div class="top">
            <div class="box c-amount"><label>المبلغ الكلي</label><div class="v" id="tAmount">0</div></div>
            <div class="box c-net"><label>الصافي</label><div class="v" id="tNet">0</div></div>
            <div class="box c-profit"><label>المكسب الكلي</label><input id="profit" type="number" inputmode="decimal"></div>
            <div class="box c-exp"><label>المصروف الكلي</label><input id="expense" type="number" inputmode="decimal"></div>
          </div>

          <div class="add">
            <input id="newAmt" type="number" inputmode="decimal" placeholder="مبلغ العميل الجديد">
            <button id="addBtn">+ إضافة عميل</button>
          </div>

          <div class="wrap">
          <table>
            <thead><tr>
              <th class="h-id">العميل</th><th class="h-amt">المبلغ</th><th class="h-pct">النسبة</th>
              <th class="h-gain">المكسب</th><th class="h-exp">المصروف</th><th class="h-net">الصافي</th><th class="h-del">حذف</th>
            </tr></thead>
            <tbody id="body"></tbody>
            <tfoot id="foot"></tfoot>
          </table>
          </div>

          <script>
          const KEY="contrib_app_v1";
          let state;
          try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
          if(!state||!Array.isArray(state.clients)){
            state={profit:48000,expense:3000,clients:[
              ["A",50000],["B",60000],["C",50000],["D",10000],["E",80000],["F",60000],
              ["G",50000],["H",40000],["I",70000],["J",40000],["K",15000],["L",75000]
            ].map(([id,amount])=>({id,amount}))};
          }
          function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
          const fmt=n=>(Math.round(n*100)/100).toLocaleString("en",{maximumFractionDigits:2});
          const toName=n=>n<26?String.fromCharCode(65+n):toName(Math.floor(n/26)-1)+String.fromCharCode(65+n%26);
          function nextId(){const used=new Set(state.clients.map(c=>c.id));for(let i=0;;i++){const s=toName(i);if(!used.has(s))return s}}

          function render(){
            const total=state.clients.reduce((s,c)=>s+c.amount,0);
            const P=+state.profit||0,E=+state.expense||0;
            let sg=0,se=0,sn=0,sp=0;
            const body=document.getElementById("body");
            body.innerHTML="";
            if(!state.clients.length){body.innerHTML='<tr><td colspan="7" class="empty">لا يوجد عملاء</td></tr>'}
            state.clients.forEach((c,i)=>{
              const pct=total?c.amount/total:0,g=P*pct,e=E*pct,n=g-e;
              sg+=g;se+=e;sn+=n;sp+=pct;
              const tr=document.createElement("tr");
              tr.innerHTML=`<td class="id">${c.id}</td>
                <td class="amt"><input type="number" inputmode="decimal" value="${c.amount}"></td>
                <td class="pct">${fmt(pct*100)}%</td><td class="gain">${fmt(g)}</td>
                <td class="exp">${fmt(e)}</td><td class="net">${fmt(n)}</td>
                <td class="del"><button>حذف</button></td>`;
              tr.querySelector("input").addEventListener("change",ev=>{
                state.clients[i].amount=Math.max(0,+ev.target.value||0);save();render();
              });
              tr.querySelector("button").addEventListener("click",()=>{
                if(confirm("حذف العميل "+c.id+"؟")){state.clients.splice(i,1);save();render()}
              });
              body.appendChild(tr);
            });
            document.getElementById("foot").innerHTML=state.clients.length?
              `<tr><td>الإجمالي</td><td>${fmt(total)}</td><td>${fmt(sp*100)}%</td><td>${fmt(sg)}</td><td>${fmt(se)}</td><td>${fmt(sn)}</td><td></td></tr>`:"";
            document.getElementById("tAmount").textContent=fmt(total);
            document.getElementById("tNet").textContent=fmt(P-E);
          }

          const pIn=document.getElementById("profit"),eIn=document.getElementById("expense");
          pIn.value=state.profit;eIn.value=state.expense;
          pIn.addEventListener("input",()=>{state.profit=+pIn.value||0;save();render()});
          eIn.addEventListener("input",()=>{state.expense=+eIn.value||0;save();render()});

          document.getElementById("addBtn").addEventListener("click",()=>{
            const inp=document.getElementById("newAmt"),v=+inp.value;
            if(!(v>0)){inp.focus();return}
            state.clients.push({id:nextId(),amount:v});
            inp.value="";save();render();
          });
          render();
          </script>
          </body>
          </html>
          __EOF__

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: contrib-app-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
